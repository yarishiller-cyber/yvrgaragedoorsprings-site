<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A hand pulling the red emergency-release cord on a garage door opener</title>
  <desc id="desc">Close-up of a hand reaching up to pull the red emergency-release cord that hangs from a garage door opener carriage.</desc>
  <defs>
    <radialGradient id="warm" cx="0.7" cy="0.0" r="0.8">
      <stop offset="0" stop-color="#fcd9a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fcd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#2a1d10"/>
  <rect width="1600" height="900" fill="url(#warm)"/>

  <!-- Ceiling -->
  <rect width="1600" height="100" fill="#1a1006"/>

  <!-- Ceiling rail / opener track (horizontal, hanging from ceiling) -->
  <g transform="translate(200, 80)">
    <!-- Mounting brackets -->
    <rect x="0" y="0" width="40" height="80" fill="#0f1a1f"/>
    <rect x="1160" y="0" width="40" height="80" fill="#0f1a1f"/>
    <!-- Track -->
    <rect x="40" y="60" width="1120" height="30" fill="#3a525c"/>
    <rect x="40" y="60" width="1120" height="6" fill="#a8b6bd"/>
    <rect x="40" y="84" width="1120" height="6" fill="#0f1a1f"/>

    <!-- Carriage assembly mid-track -->
    <g transform="translate(420, 50)">
      <rect width="320" height="80" rx="6" fill="#1f3a44"/>
      <!-- Trolley body -->
      <rect x="20" y="14" width="280" height="22" fill="#3a525c"/>
      <text x="160" y="60" text-anchor="middle" fill="#cfd6da" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing=".25em" opacity=".7">CARRIAGE</text>
      <!-- Release latch -->
      <rect x="150" y="40" width="20" height="40" fill="#0f1a1f"/>
    </g>
  </g>

  <!-- Red emergency-release cord hanging down -->
  <g>
    <!-- Cord -->
    <line x1="780" y1="180" x2="780" y2="500" stroke="#d94a2b" stroke-width="6"/>
    <!-- Slight sway/bend -->
    <path d="M 780 500 Q 783 540 778 580 Q 776 620 780 660" stroke="#d94a2b" stroke-width="6" fill="none"/>
    <!-- Red handle/pull at bottom -->
    <g transform="translate(780, 660)">
      <ellipse cx="0" cy="0" rx="48" ry="24" fill="#b73d22"/>
      <ellipse cx="0" cy="-3" rx="48" ry="18" fill="#d94a2b"/>
      <ellipse cx="-15" cy="-7" rx="22" ry="6" fill="#ffffff" opacity=".35"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing=".15em">PULL</text>
    </g>
  </g>

  <!-- Hand reaching up from below -->
  <g transform="translate(640, 700)">
    <!-- Forearm (in shadow) -->
    <path d="M 100 200 L 80 100 Q 80 70 110 60 L 220 50 Q 250 50 260 80 L 270 180" fill="#d4a878"/>
    <!-- Wrist shadow -->
    <ellipse cx="180" cy="90" rx="80" ry="10" fill="#0f1a1f" opacity=".25"/>
    <!-- Palm -->
    <ellipse cx="190" cy="50" rx="90" ry="44" fill="#d4a878"/>
    <!-- Thumb (going up around cord) -->
    <path d="M 110 30 Q 100 0 130 -20 Q 160 -10 160 30" fill="#d4a878"/>
    <!-- Fingers gripping cord -->
    <g fill="#c89668">
      <rect x="150" y="-30" width="22" height="80" rx="10"/>
      <rect x="178" y="-40" width="22" height="90" rx="10"/>
      <rect x="206" y="-34" width="22" height="84" rx="10"/>
      <rect x="234" y="-20" width="22" height="74" rx="10"/>
    </g>
    <!-- Fingernails -->
    <g fill="#f0c89a">
      <rect x="154" y="-26" width="14" height="6" rx="3"/>
      <rect x="182" y="-36" width="14" height="6" rx="3"/>
      <rect x="210" y="-30" width="14" height="6" rx="3"/>
      <rect x="238" y="-16" width="14" height="6" rx="3"/>
    </g>
    <!-- Glove cuff -->
    <rect x="80" y="180" width="200" height="30" fill="#3a2a18"/>
  </g>

  <!-- Sliver of door frame below to ground scene -->
  <rect x="0" y="780" width="1600" height="120" fill="#1a1006"/>
  <rect x="0" y="780" width="1600" height="4" fill="#3a2a18"/>

  <!-- Annotation -->
  <g transform="translate(900, 280)">
    <line x1="-100" y1="320" x2="0" y2="0" stroke="#d94a2b" stroke-width="2"/>
    <rect width="280" height="48" rx="24" fill="#d94a2b"/>
    <text x="140" y="32" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800">PULL TO DISENGAGE</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="80" fill="#cfd6da" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing=".2em" opacity=".7">THE 30-SECOND TEST</text>

  <!-- Bottom caption -->
  <text x="800" y="850" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" opacity=".8">Disconnect the motor. Lift by hand. Heavy = spring. Light = opener.</text>
</svg>
