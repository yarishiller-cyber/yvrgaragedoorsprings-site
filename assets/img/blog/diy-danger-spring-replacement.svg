<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why you don't replace your own torsion spring — the danger zone</title>
  <desc id="desc">An anatomical, alarming editorial illustration. A wound torsion spring with stored energy graphic, three failure modes shown, and the ER stats that follow DIY attempts.</desc>

  <defs>
    <linearGradient id="dangerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce8e2"/>
      <stop offset="1" stop-color="#fde8d6"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d94a2b"/>
      <stop offset="1" stop-color="#b73d22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#dangerBg)"/>

  <!-- Hazard stripe -->
  <g transform="translate(0, 0)">
    <pattern id="stripe" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#fce8e2"/>
      <rect width="20" height="40" fill="#d94a2b"/>
    </pattern>
    <rect width="1600" height="14" fill="url(#stripe)"/>
    <rect y="886" width="1600" height="14" fill="url(#stripe)"/>
  </g>

  <!-- Title -->
  <text x="80" y="74" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing=".24em">⚠ STORED ENERGY · 200–400 LB OF FORCE</text>
  <text x="80" y="120" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.01em">Why winding it yourself is in the top-10 dumbest DIY ideas.</text>

  <!-- Left side: spring with energy visualization -->
  <g transform="translate(120, 220)">
    <!-- Brackets -->
    <rect x="0" y="80" width="40" height="120" fill="#0f1a1f"/>
    <rect x="-12" y="180" width="64" height="20" fill="#0f1a1f"/>
    <rect x="700" y="80" width="40" height="120" fill="#0f1a1f"/>
    <rect x="688" y="180" width="64" height="20" fill="#0f1a1f"/>
    <!-- Shaft -->
    <rect x="40" y="118" width="700" height="24" fill="#8d9aa1"/>
    <rect x="40" y="118" width="700" height="4" fill="#fff" opacity=".25"/>
    <!-- Spring (wound, tense) -->
    <rect x="80" y="90" width="600" height="80" fill="#0f1a1f" rx="3"/>
    <g stroke="#d94a2b" stroke-width="2.5" opacity=".75">
      <line x1="90" y1="90" x2="90" y2="170"/>
      <line x1="106" y1="90" x2="106" y2="170"/>
      <line x1="122" y1="90" x2="122" y2="170"/>
      <line x1="138" y1="90" x2="138" y2="170"/>
      <line x1="154" y1="90" x2="154" y2="170"/>
      <line x1="170" y1="90" x2="170" y2="170"/>
      <line x1="186" y1="90" x2="186" y2="170"/>
      <line x1="202" y1="90" x2="202" y2="170"/>
      <line x1="218" y1="90" x2="218" y2="170"/>
      <line x1="234" y1="90" x2="234" y2="170"/>
      <line x1="250" y1="90" x2="250" y2="170"/>
      <line x1="266" y1="90" x2="266" y2="170"/>
      <line x1="282" y1="90" x2="282" y2="170"/>
      <line x1="298" y1="90" x2="298" y2="170"/>
      <line x1="314" y1="90" x2="314" y2="170"/>
      <line x1="330" y1="90" x2="330" y2="170"/>
      <line x1="346" y1="90" x2="346" y2="170"/>
      <line x1="362" y1="90" x2="362" y2="170"/>
      <line x1="378" y1="90" x2="378" y2="170"/>
      <line x1="394" y1="90" x2="394" y2="170"/>
      <line x1="410" y1="90" x2="410" y2="170"/>
      <line x1="426" y1="90" x2="426" y2="170"/>
      <line x1="442" y1="90" x2="442" y2="170"/>
      <line x1="458" y1="90" x2="458" y2="170"/>
      <line x1="474" y1="90" x2="474" y2="170"/>
      <line x1="490" y1="90" x2="490" y2="170"/>
      <line x1="506" y1="90" x2="506" y2="170"/>
      <line x1="522" y1="90" x2="522" y2="170"/>
      <line x1="538" y1="90" x2="538" y2="170"/>
      <line x1="554" y1="90" x2="554" y2="170"/>
      <line x1="570" y1="90" x2="570" y2="170"/>
      <line x1="586" y1="90" x2="586" y2="170"/>
      <line x1="602" y1="90" x2="602" y2="170"/>
      <line x1="618" y1="90" x2="618" y2="170"/>
      <line x1="634" y1="90" x2="634" y2="170"/>
      <line x1="650" y1="90" x2="650" y2="170"/>
      <line x1="666" y1="90" x2="666" y2="170"/>
    </g>
    <!-- Glowing red highlight along the spring (stored energy) -->
    <rect x="80" y="90" width="600" height="80" fill="url(#energyGrad)" opacity=".22" rx="3"/>
    <!-- Rotation arrow + force label -->
    <g transform="translate(380, 60)">
      <path d="M -80 0 A 80 80 0 1 1 80 0" stroke="#d94a2b" stroke-width="6" fill="none"/>
      <polygon points="80,0 64,-14 64,14" fill="#d94a2b"/>
      <text x="0" y="-46" text-anchor="middle" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing=".06em">7½ TURNS WOUND</text>
    </g>
    <!-- Energy callout -->
    <g transform="translate(380, 260)">
      <rect x="-140" y="0" width="280" height="64" rx="32" fill="#d94a2b"/>
      <text x="0" y="26" text-anchor="middle" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing=".06em">≈ 350 LB-FT OF TORQUE</text>
      <text x="0" y="48" text-anchor="middle" fill="#fde8d6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">stored in steel, ready to release in 80 ms if mishandled</text>
    </g>
  </g>

  <!-- Right side: stats panel -->
  <g transform="translate(900, 220)">
    <text x="0" y="0" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">The numbers nobody tells you.</text>

    <g transform="translate(0, 36)">
      <rect width="540" height="84" rx="8" fill="#fff" stroke="#d94a2b" stroke-width="2"/>
      <text x="20" y="32" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">~25,000</text>
      <text x="180" y="32" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">North-American garage-door ER visits per year</text>
      <text x="180" y="56" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">most are DIY-related. CPSC + NEISS data, US/Can. averaged.</text>
    </g>

    <g transform="translate(0, 136)">
      <rect width="540" height="84" rx="8" fill="#fff" stroke="#d94a2b" stroke-width="2"/>
      <text x="20" y="32" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">80 ms</text>
      <text x="180" y="32" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">how fast a wound spring releases when it lets go</text>
      <text x="180" y="56" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">faster than your blink reflex (≈100 ms).</text>
    </g>

    <g transform="translate(0, 236)">
      <rect width="540" height="84" rx="8" fill="#fff" stroke="#d94a2b" stroke-width="2"/>
      <text x="20" y="32" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">$832</text>
      <text x="180" y="32" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">what we charge to do it right, with insurance</text>
      <text x="180" y="56" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">two springs + cables + balance + warranty. Done in 45 min.</text>
    </g>

    <g transform="translate(0, 336)">
      <rect width="540" height="84" rx="8" fill="#fff" stroke="#d94a2b" stroke-width="2"/>
      <text x="20" y="32" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">$3,400</text>
      <text x="180" y="32" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">avg cost of a hand surgery after a DIY spring slip</text>
      <text x="180" y="56" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">BC has MSP, you have a deductible and weeks off work.</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <g transform="translate(80, 800)">
    <rect width="1440" height="64" rx="8" fill="#d94a2b"/>
    <text x="40" y="32" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing=".24em">THE THREE TOOLS YOU NEED</text>
    <text x="40" y="52" fill="#fde8d6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">matched winding bars · cable-locking vise grips · drum-set wrench · AND nine years of doing this five times a week</text>
  </g>
</svg>
