<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Frost on a garage door torsion spring on a sub-zero Vancouver morning</title>
  <desc id="desc">Macro view of ice crystals on the surface of a black oil-tempered torsion spring, with steam in the cold morning air.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce4e8"/>
      <stop offset="1" stop-color="#aec0c8"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a525c"/>
      <stop offset=".5" stop-color="#0f1a1f"/>
      <stop offset="1" stop-color="#3a525c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Cold breath fog (rising) -->
  <g opacity=".5">
    <ellipse cx="300" cy="200" rx="180" ry="40" fill="#ffffff"/>
    <ellipse cx="600" cy="160" rx="220" ry="50" fill="#ffffff"/>
    <ellipse cx="1000" cy="190" rx="200" ry="44" fill="#ffffff"/>
    <ellipse cx="1300" cy="170" rx="160" ry="36" fill="#ffffff"/>
  </g>

  <!-- Distant garage wall (out of focus) -->
  <rect y="640" width="1600" height="260" fill="#8aa3ad" opacity=".5"/>

  <!-- Shaft (horizontal, large macro view) -->
  <rect x="40" y="500" width="1520" height="40" fill="#a8b6bd"/>
  <rect x="40" y="500" width="1520" height="8" fill="#ffffff" opacity=".4"/>
  <rect x="40" y="528" width="1520" height="12" fill="#0f1a1f" opacity=".3"/>

  <!-- Large macro spring (just one section, very close up) -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="1440" height="180" rx="8" fill="url(#spring)"/>

    <!-- Coil winding lines (heavy macro detail) -->
    <g stroke="#8aa3ad" stroke-width="3" opacity=".7">
      <line x1="20" y1="0" x2="20" y2="180"/><line x1="50" y1="0" x2="50" y2="180"/><line x1="80" y1="0" x2="80" y2="180"/><line x1="110" y1="0" x2="110" y2="180"/><line x1="140" y1="0" x2="140" y2="180"/><line x1="170" y1="0" x2="170" y2="180"/><line x1="200" y1="0" x2="200" y2="180"/><line x1="230" y1="0" x2="230" y2="180"/><line x1="260" y1="0" x2="260" y2="180"/><line x1="290" y1="0" x2="290" y2="180"/><line x1="320" y1="0" x2="320" y2="180"/><line x1="350" y1="0" x2="350" y2="180"/><line x1="380" y1="0" x2="380" y2="180"/><line x1="410" y1="0" x2="410" y2="180"/><line x1="440" y1="0" x2="440" y2="180"/><line x1="470" y1="0" x2="470" y2="180"/><line x1="500" y1="0" x2="500" y2="180"/><line x1="530" y1="0" x2="530" y2="180"/><line x1="560" y1="0" x2="560" y2="180"/><line x1="590" y1="0" x2="590" y2="180"/><line x1="620" y1="0" x2="620" y2="180"/><line x1="650" y1="0" x2="650" y2="180"/><line x1="680" y1="0" x2="680" y2="180"/><line x1="710" y1="0" x2="710" y2="180"/><line x1="740" y1="0" x2="740" y2="180"/><line x1="770" y1="0" x2="770" y2="180"/><line x1="800" y1="0" x2="800" y2="180"/><line x1="830" y1="0" x2="830" y2="180"/><line x1="860" y1="0" x2="860" y2="180"/><line x1="890" y1="0" x2="890" y2="180"/><line x1="920" y1="0" x2="920" y2="180"/><line x1="950" y1="0" x2="950" y2="180"/><line x1="980" y1="0" x2="980" y2="180"/><line x1="1010" y1="0" x2="1010" y2="180"/><line x1="1040" y1="0" x2="1040" y2="180"/><line x1="1070" y1="0" x2="1070" y2="180"/><line x1="1100" y1="0" x2="1100" y2="180"/><line x1="1130" y1="0" x2="1130" y2="180"/><line x1="1160" y1="0" x2="1160" y2="180"/><line x1="1190" y1="0" x2="1190" y2="180"/><line x1="1220" y1="0" x2="1220" y2="180"/><line x1="1250" y1="0" x2="1250" y2="180"/><line x1="1280" y1="0" x2="1280" y2="180"/><line x1="1310" y1="0" x2="1310" y2="180"/><line x1="1340" y1="0" x2="1340" y2="180"/><line x1="1370" y1="0" x2="1370" y2="180"/><line x1="1400" y1="0" x2="1400" y2="180"/><line x1="1420" y1="0" x2="1420" y2="180"/>
    </g>

    <!-- Heavy frost layer on top half -->
    <rect x="0" y="0" width="1440" height="80" fill="#ffffff" opacity=".75"/>
    <rect x="0" y="80" width="1440" height="20" fill="#ffffff" opacity=".4"/>
    <rect x="0" y="100" width="1440" height="10" fill="#ffffff" opacity=".2"/>

    <!-- Ice crystals rising from spring -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2">
      <!-- Crystal 1 -->
      <g transform="translate(120, 0)">
        <line x1="0" y1="0" x2="0" y2="-50" stroke-width="3"/>
        <line x1="-12" y1="-20" x2="12" y2="-20" stroke-width="2"/>
        <line x1="-8" y1="-36" x2="8" y2="-36" stroke-width="2"/>
        <line x1="-6" y1="-46" x2="6" y2="-46" stroke-width="2"/>
      </g>
      <g transform="translate(280, 0)">
        <line x1="0" y1="0" x2="0" y2="-40" stroke-width="3"/>
        <line x1="-10" y1="-16" x2="10" y2="-16" stroke-width="2"/>
        <line x1="-7" y1="-28" x2="7" y2="-28" stroke-width="2"/>
      </g>
      <g transform="translate(440, 0)">
        <line x1="0" y1="0" x2="0" y2="-60" stroke-width="3"/>
        <line x1="-14" y1="-20" x2="14" y2="-20" stroke-width="2"/>
        <line x1="-10" y1="-36" x2="10" y2="-36" stroke-width="2"/>
        <line x1="-7" y1="-50" x2="7" y2="-50" stroke-width="2"/>
      </g>
      <g transform="translate(600, 0)">
        <line x1="0" y1="0" x2="0" y2="-44" stroke-width="3"/>
        <line x1="-10" y1="-18" x2="10" y2="-18" stroke-width="2"/>
        <line x1="-7" y1="-32" x2="7" y2="-32" stroke-width="2"/>
      </g>
      <g transform="translate(760, 0)">
        <line x1="0" y1="0" x2="0" y2="-56" stroke-width="3"/>
        <line x1="-12" y1="-22" x2="12" y2="-22" stroke-width="2"/>
        <line x1="-9" y1="-38" x2="9" y2="-38" stroke-width="2"/>
        <line x1="-6" y1="-48" x2="6" y2="-48" stroke-width="2"/>
      </g>
      <g transform="translate(920, 0)">
        <line x1="0" y1="0" x2="0" y2="-36" stroke-width="3"/>
        <line x1="-10" y1="-16" x2="10" y2="-16" stroke-width="2"/>
      </g>
      <g transform="translate(1080, 0)">
        <line x1="0" y1="0" x2="0" y2="-52" stroke-width="3"/>
        <line x1="-12" y1="-20" x2="12" y2="-20" stroke-width="2"/>
        <line x1="-8" y1="-34" x2="8" y2="-34" stroke-width="2"/>
        <line x1="-6" y1="-46" x2="6" y2="-46" stroke-width="2"/>
      </g>
      <g transform="translate(1240, 0)">
        <line x1="0" y1="0" x2="0" y2="-44" stroke-width="3"/>
        <line x1="-10" y1="-18" x2="10" y2="-18" stroke-width="2"/>
        <line x1="-7" y1="-32" x2="7" y2="-32" stroke-width="2"/>
      </g>
      <g transform="translate(1380, 0)">
        <line x1="0" y1="0" x2="0" y2="-32" stroke-width="3"/>
        <line x1="-8" y1="-14" x2="8" y2="-14" stroke-width="2"/>
      </g>
    </g>

    <!-- Bottom edge of spring (still dark) -->
    <rect x="0" y="160" width="1440" height="20" fill="#000000" opacity=".4"/>
  </g>

  <!-- Floating large snowflake decorations -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity=".75">
    <g transform="translate(200, 120)">
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-16" y1="-16" x2="16" y2="16"/>
      <line x1="-16" y1="16" x2="16" y2="-16"/>
    </g>
    <g transform="translate(1400, 100) scale(0.8)">
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-16" y1="-16" x2="16" y2="16"/>
      <line x1="-16" y1="16" x2="16" y2="-16"/>
    </g>
    <g transform="translate(900, 80) scale(0.5)">
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="-22" x2="0" y2="22"/>
    </g>
  </g>

  <!-- Top label -->
  <text x="80" y="60" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing=".2em" opacity=".7">−2°C · STEEL GOES BRITTLE</text>

  <!-- Bottom caption -->
  <text x="800" y="800" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" opacity=".7">Our call volume doubles for 3–5 days after every drop below 0°C.</text>
</svg>
