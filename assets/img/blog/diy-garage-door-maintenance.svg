<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DIY garage door maintenance kit — white lithium grease, photo-eye wipe cloth, and a 2x4</title>
  <desc id="desc">Top-down flat-lay of homeowner-friendly garage door maintenance items on a clean workbench.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d4c8"/>
      <stop offset="1" stop-color="#bcb39d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bench)"/>

  <!-- Wood plank seams -->
  <g stroke="#9b8d72" stroke-width="2" opacity=".5">
    <line x1="0" y1="220" x2="1600" y2="220"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
  </g>

  <!-- 2x4 lumber (left-bottom) -->
  <g transform="translate(80, 480) rotate(-6)">
    <rect width="700" height="80" fill="#d2b894"/>
    <rect width="700" height="12" fill="#e8d5b0"/>
    <rect y="68" width="700" height="12" fill="#a89070"/>
    <!-- Wood grain -->
    <g stroke="#a89070" stroke-width="1" opacity=".5">
      <path d="M 0,30 Q 200,28 400,32 Q 600,30 700,30" fill="none"/>
      <path d="M 0,48 Q 200,50 400,46 Q 600,50 700,48" fill="none"/>
      <path d="M 0,62 Q 200,60 400,64 Q 600,62 700,62" fill="none"/>
    </g>
    <!-- Label -->
    <text x="350" y="48" text-anchor="middle" fill="#7a5a30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" opacity=".55" letter-spacing=".15em">2 × 4 · BALANCE TEST</text>
    <!-- End grain -->
    <rect width="14" height="80" fill="#a89070"/>
    <rect x="686" width="14" height="80" fill="#a89070"/>
  </g>

  <!-- White lithium grease cartridge (top right) -->
  <g transform="translate(960, 160) rotate(12)">
    <!-- Cylinder body -->
    <rect width="440" height="100" rx="6" fill="#fafaf7" stroke="#0f1a1f" stroke-width="3"/>
    <!-- Highlight -->
    <rect y="6" width="440" height="14" fill="#ffffff"/>
    <rect y="84" width="440" height="14" fill="#d9d4c8"/>
    <!-- Label section -->
    <rect x="60" y="0" width="280" height="100" fill="#1f3a44"/>
    <text x="200" y="34" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing=".1em">WHITE LITHIUM</text>
    <text x="200" y="56" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" opacity=".8">MULTI-PURPOSE GREASE</text>
    <text x="200" y="78" text-anchor="middle" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">NO WD-40 · NO SILICONE</text>
    <!-- Nozzle -->
    <rect x="440" y="34" width="40" height="32" fill="#1f3a44"/>
    <rect x="480" y="40" width="60" height="20" fill="#3a525c"/>
    <polygon points="540,40 580,50 540,60" fill="#3a525c"/>
    <!-- Plunger end -->
    <rect x="-12" y="14" width="12" height="72" fill="#cfd6da"/>
  </g>

  <!-- Microfibre cloth (folded, top left, slightly turned) -->
  <g transform="translate(180, 140) rotate(-10)">
    <!-- Cloth folded -->
    <rect width="320" height="240" fill="#e8e1d2" stroke="#9b8d72" stroke-width="2"/>
    <!-- Fold lines -->
    <line x1="0" y1="80" x2="320" y2="80" stroke="#c4ba9f" stroke-width="1"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#c4ba9f" stroke-width="1"/>
    <!-- Texture -->
    <g stroke="#c4ba9f" stroke-width="1" opacity=".5">
      <line x1="20" y1="0" x2="20" y2="240"/>
      <line x1="60" y1="0" x2="60" y2="240"/>
      <line x1="100" y1="0" x2="100" y2="240"/>
      <line x1="140" y1="0" x2="140" y2="240"/>
      <line x1="180" y1="0" x2="180" y2="240"/>
      <line x1="220" y1="0" x2="220" y2="240"/>
      <line x1="260" y1="0" x2="260" y2="240"/>
      <line x1="300" y1="0" x2="300" y2="240"/>
    </g>
    <!-- Folded corner shadow -->
    <path d="M 280 0 L 320 0 L 320 40 Z" fill="#c4ba9f" opacity=".7"/>
    <!-- Label tag -->
    <rect x="60" y="100" width="200" height="44" fill="#3a525c"/>
    <text x="160" y="128" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing=".1em">PHOTO-EYE WIPE</text>
  </g>

  <!-- Small label tags / hand-lettered annotations -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Tag near 2x4 -->
    <g transform="translate(340, 720)">
      <text fill="#0f1a1f" font-size="16" font-weight="800" opacity=".7">↑ Lay flat across track. Door should rest balanced.</text>
    </g>
    <!-- Tag near grease -->
    <g transform="translate(880, 380)">
      <text fill="#0f1a1f" font-size="16" font-weight="800" opacity=".7">← Hinges + rollers, 2× per year</text>
    </g>
    <!-- Tag near cloth -->
    <g transform="translate(540, 220)">
      <text fill="#0f1a1f" font-size="16" font-weight="800" opacity=".7">← Wipe lenses · check auto-reverse</text>
    </g>
  </g>

  <!-- Eyebrow + caption -->
  <text x="80" y="80" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing=".2em" opacity=".6">THE HOMEOWNER'S KIT · UNDER $40</text>

  <text x="800" y="840" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" opacity=".7">Four things you can do safely. Three things you absolutely shouldn't.</text>
</svg>
