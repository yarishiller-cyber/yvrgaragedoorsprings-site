    <g stroke="#8d9aa1" stroke-width="2" opacity=".7">
      <line x1="14" y1="0" x2="14" y2="60"/><line x1="28" y1="0" x2="28" y2="60"/><line x1="42" y1="0" x2="42" y2="60"/><line x1="56" y1="0" x2="56" y2="60"/><line x1="70" y1="0" x2="70" y2="60"/><line x1="84" y1="0" x2="84" y2="60"/><line x1="98" y1="0" x2="98" y2="60"/><line x1="112" y1="0" x2="112" y2="60"/><line x1="126" y1="0" x2="126" y2="60"/><line x1="140" y1="0" x2="140" y2="60"/><line x1="180" y1="0" x2="180" y2="60"/><line x1="194" y1="0" x2="194" y2="60"/><line x1="208" y1="0" x2="208" y2="60"/><line x1="222" y1="0" x2="222" y2="60"/><line x1="236" y1="0" x2="236" y2="60"/><line x1="250" y1="0" x2="250" y2="60"/><line x1="264" y1="0" x2="264" y2="60"/><line x1="278" y1="0" x2="278" y2="60"/><line x1="292" y1="0" x2="292" y2="60"/><line x1="306" y1="0" x2="306" y2="60"/>
    </g>
    <!-- The gap -->
    <rect x="150" y="0" width="20" height="60" fill="#0f1a1f"/>
    <!-- Arrow -->
    <path d="M 160 -80 L 160 -10" stroke="#d94a2b" stroke-width="6"/>
    <polygon points="160,0 148,-22 172,-22" fill="#d94a2b"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="586" width="1200" height="44" fill="#1f3a44"/>
  <text x="80" y="615" fill="#cbd5d8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".15em">SIXTEEN CITIES · ONE TECH IN EACH · QUOTED = PAID</text>
