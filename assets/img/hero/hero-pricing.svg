<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Three garage door spring tiers shown as price cards on a workbench</title>
  <desc id="desc">Three coiled torsion springs of different sizes laid out left-to-right with hand-lettered price tags.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e1d2"/>
      <stop offset="1" stop-color="#c8bfa9"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#bench)"/>
  <rect width="1600" height="1200" fill="url(#spotlight)"/>

  <!-- Wood grain hints -->
  <g stroke="#a89578" stroke-width="1" opacity=".4">
    <path d="M0,300 Q800,290 1600,310" fill="none"/>
    <path d="M0,520 Q800,510 1600,530" fill="none"/>
    <path d="M0,820 Q800,830 1600,810" fill="none"/>
    <path d="M0,1020 Q800,1010 1600,1030" fill="none"/>
  </g>

  <!-- Spring 1: small -->
  <g transform="translate(180, 380)">
    <ellipse cx="120" cy="200" rx="120" ry="140" fill="none" stroke="#0f1a1f" stroke-width="28"/>
    <ellipse cx="120" cy="200" rx="80" ry="100" fill="none" stroke="#1f3a44" stroke-width="20"/>
    <ellipse cx="120" cy="200" rx="50" ry="60" fill="none" stroke="#0f1a1f" stroke-width="14"/>
    <ellipse cx="120" cy="200" rx="22" ry="28" fill="#3a4a52"/>
  </g>
  <!-- Tag 1 -->
  <g transform="translate(180, 740) rotate(-4)">
    <rect width="240" height="120" fill="#fafaf7" stroke="#0f1a1f" stroke-width="3"/>
    <circle cx="20" cy="20" r="6" fill="#0f1a1f"/>
    <text x="120" y="44" text-anchor="middle" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">ONE SPRING</text>
    <text x="120" y="92" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">$784</text>
  </g>

  <!-- Spring 2: medium, featured -->
  <g transform="translate(620, 340)">
    <ellipse cx="160" cy="240" rx="160" ry="180" fill="none" stroke="#0f1a1f" stroke-width="34"/>
    <ellipse cx="160" cy="240" rx="110" ry="130" fill="none" stroke="#1f3a44" stroke-width="24"/>
    <ellipse cx="160" cy="240" rx="70" ry="84" fill="none" stroke="#0f1a1f" stroke-width="16"/>
    <ellipse cx="160" cy="240" rx="30" ry="36" fill="#3a4a52"/>
  </g>
  <!-- Tag 2 (featured) -->
  <g transform="translate(620, 760) rotate(3)">
    <rect width="320" height="140" fill="#d94a2b" stroke="#0f1a1f" stroke-width="3"/>
    <circle cx="20" cy="20" r="6" fill="#0f1a1f"/>
    <text x="160" y="40" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">★ 95% PICK THIS</text>
    <text x="160" y="72" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">TWO SPRINGS</text>
    <text x="160" y="120" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">$832</text>
  </g>

  <!-- Spring 3: large -->
  <g transform="translate(1140, 320)">
    <ellipse cx="180" cy="260" rx="180" ry="200" fill="none" stroke="#0f1a1f" stroke-width="40"/>
    <ellipse cx="180" cy="260" rx="120" ry="140" fill="none" stroke="#1f3a44" stroke-width="28"/>
    <ellipse cx="180" cy="260" rx="76" ry="90" fill="none" stroke="#0f1a1f" stroke-width="18"/>
    <ellipse cx="180" cy="260" rx="34" ry="40" fill="#3a4a52"/>
  </g>
  <!-- Tag 3 -->
  <g transform="translate(1170, 770) rotate(-3)">
    <rect width="280" height="140" fill="#fafaf7" stroke="#0f1a1f" stroke-width="3"/>
    <circle cx="20" cy="20" r="6" fill="#0f1a1f"/>
    <text x="140" y="40" text-anchor="middle" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">HIGH-CYCLE</text>
    <text x="140" y="64" text-anchor="middle" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">25,000 CYCLES</text>
    <text x="140" y="116" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800">$1,193</text>
  </g>

  <!-- Quoted = paid line -->
  <text x="800" y="1100" text-anchor="middle" fill="#0f1a1f" opacity=".55" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing=".1em">QUOTED PRICE = PAID PRICE · ALL-IN · PLUS GST/PST</text>
</svg>
