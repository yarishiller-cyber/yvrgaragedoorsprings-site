<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">YVR Garage Door Springs — Greater Vancouver spring repair, same day</title>
  <rect width="1200" height="630" fill="#0f1a1f"/>

  <!-- Brand mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#fafaf7"/>
    <text x="32" y="46" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">Y</text>
  </g>
  <text x="170" y="124" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing=".05em">YVR Garage Door Springs</text>

