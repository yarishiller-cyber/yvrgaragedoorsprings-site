<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The 60-second garage door balance test — three steps</title>
  <desc id="desc">Editorial step-by-step illustration. Step 1: pull the red emergency-release cord. Step 2: lift the door slowly to about 3 feet. Step 3: let go and watch what it does.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e8e1d2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="64" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing=".2em">THE 60-SECOND BALANCE TEST</text>
  <line x1="80" y1="80" x2="1520" y2="80" stroke="#d9d4c8" stroke-width="2"/>

  <!-- Three columns -->
  <!-- ====== STEP 1: pull the red cord ====== -->
  <g transform="translate(120, 130)">
    <circle r="36" cx="0" cy="0" fill="#0f1a1f"/>
    <text x="0" y="10" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">1</text>
    <text x="56" y="-5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Pull the red cord</text>
    <text x="56" y="22" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Disconnects the opener.</text>
  </g>
  <g transform="translate(180, 250)">
    <!-- ceiling rail -->
    <rect x="0" y="0" width="280" height="20" fill="#3a525c" stroke="#0f1a1f" stroke-width="2"/>
    <rect x="0" y="20" width="280" height="6" fill="#1f3a44"/>
    <!-- carriage -->
    <rect x="100" y="-14" width="80" height="14" fill="#0f1a1f"/>
    <rect x="110" y="-10" width="60" height="6" fill="#5a6a78"/>
    <text x="140" y="-22" text-anchor="middle" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".12em">CARRIAGE</text>
    <!-- red cord -->
    <path d="M 140 26 Q 142 80 138 130 Q 134 180 140 230" stroke="#d94a2b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- pull handle -->
    <g transform="translate(140, 240)">
      <ellipse cx="0" cy="0" rx="32" ry="14" fill="#b73d22"/>
      <ellipse cx="0" cy="-2" rx="32" ry="10" fill="#d94a2b"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing=".1em">PULL</text>
    </g>
    <!-- hand -->
    <g transform="translate(195, 260)">
      <path d="M 0 0 L 0 90 L 28 90 L 28 -10 Q 18 -16 0 -10 Z" fill="#d4a878"/>
      <rect x="-6" y="-12" width="14" height="20" rx="6" fill="#c89668"/>
    </g>
    <!-- annotation arrow -->
    <path d="M 220 240 Q 250 240 270 232" stroke="#d94a2b" stroke-width="2.5" fill="none"/>
    <polygon points="270,232 254,228 258,242" fill="#d94a2b"/>
    <text x="278" y="244" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">One firm pull straight down</text>
  </g>

  <!-- ====== STEP 2: lift to 3 feet ====== -->
  <g transform="translate(620, 130)">
    <circle r="36" cx="0" cy="0" fill="#0f1a1f"/>
    <text x="0" y="10" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">2</text>
    <text x="56" y="-5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Lift the door to ~3 ft</text>
    <text x="56" y="22" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Both hands at the bottom. Slow and steady.</text>
  </g>
  <g transform="translate(620, 250)">
    <!-- header beam -->
    <rect x="20" y="0" width="320" height="14" fill="#0f1a1f"/>
    <!-- spring shaft + spring (small representation) -->
    <rect x="20" y="14" width="320" height="6" fill="#8d9aa1"/>
    <rect x="60" y="-2" width="240" height="16" fill="#1f3a44" rx="2"/>
    <!-- door panel — half raised -->
    <rect x="40" y="180" width="280" height="200" fill="#fafaf7" stroke="#0f1a1f" stroke-width="3"/>
    <line x1="40" y1="225" x2="320" y2="225" stroke="#0f1a1f" stroke-width="1.5"/>
    <line x1="40" y1="275" x2="320" y2="275" stroke="#0f1a1f" stroke-width="1.5"/>
    <line x1="40" y1="325" x2="320" y2="325" stroke="#0f1a1f" stroke-width="1.5"/>
    <!-- tracks -->
    <rect x="20" y="20" width="6" height="360" fill="#5a6a78"/>
    <rect x="334" y="20" width="6" height="360" fill="#5a6a78"/>
    <!-- ground -->
    <line x1="0" y1="430" x2="360" y2="430" stroke="#0f1a1f" stroke-width="3"/>
    <!-- 3 ft height marker -->
    <line x1="0" y1="430" x2="0" y2="180" stroke="#d94a2b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="-12" y="320" text-anchor="end" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">~ 3 ft</text>
    <!-- hands lifting -->
    <g transform="translate(160, 170)">
      <rect x="-14" y="0" width="28" height="40" rx="6" fill="#d4a878"/>
      <rect x="-18" y="-6" width="36" height="14" rx="6" fill="#c89668"/>
    </g>
  </g>

  <!-- ====== STEP 3: let go and watch ====== -->
  <g transform="translate(1120, 130)">
    <circle r="36" cx="0" cy="0" fill="#0f1a1f"/>
    <text x="0" y="10" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800">3</text>
    <text x="56" y="-5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Let go &amp; watch</text>
    <text x="56" y="22" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">What happens in the next 3 seconds = your diagnosis.</text>
  </g>
  <g transform="translate(1100, 260)">
    <!-- Outcome legend, four rows -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="8" fill="#2f7a3e"/>
      <text x="20" y="5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Stays put</text>
      <text x="20" y="26" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Balanced — your springs are fine.</text>
    </g>
    <g transform="translate(0, 70)">
      <circle cx="0" cy="0" r="8" fill="#b27a00"/>
      <text x="20" y="5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Drifts down slowly</text>
      <text x="20" y="26" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Springs are weakening. Call before they snap.</text>
    </g>
    <g transform="translate(0, 140)">
      <circle cx="0" cy="0" r="8" fill="#d94a2b"/>
      <text x="20" y="5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Drops fast</text>
      <text x="20" y="26" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Spring is broken or close. Don't open it again.</text>
    </g>
    <g transform="translate(0, 210)">
      <circle cx="0" cy="0" r="8" fill="#1f3a44"/>
      <text x="20" y="5" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Drifts UP</text>
      <text x="20" y="26" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Over-tensioned — opener fights this every cycle.</text>
    </g>
  </g>

  <!-- Bottom safety note -->
  <g transform="translate(80, 800)">
    <rect width="1440" height="64" rx="8" fill="#1f3a44"/>
    <text x="40" y="40" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Stand to the SIDE of the door, not under it. If it drops fast, step out of the way and call us.</text>
  </g>
</svg>
