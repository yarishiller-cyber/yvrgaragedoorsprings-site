<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Steveston harbour at low tide, weathered cannery buildings and the wooden dock at golden hour</title>
  <desc id="desc">Wide landscape illustration of Steveston Village waterfront at golden hour. Wooden fishing dock, historic cannery in the background, water in the foreground.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cd9a"/>
      <stop offset=".55" stop-color="#e8b88f"/>
      <stop offset="1" stop-color="#c89668"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4a"/>
      <stop offset=".5" stop-color="#6a5238"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.45" r="0.18">
      <stop offset="0" stop-color="#ffefb0"/>
      <stop offset="1" stop-color="#ffefb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1250" cy="380" r="80" fill="#ffefb0"/>
  <rect width="1600" height="500" fill="url(#sun)"/>

  <!-- Distant land / North Shore mountains -->
  <path d="M0,430 L120,400 L220,420 L340,395 L480,415 L600,405 L740,425 L880,400 L1000,420 L1130,410 L1280,430 L1440,415 L1600,425 L1600,500 L0,500 Z" fill="#6a5238" opacity=".7"/>

  <!-- Water -->
  <rect x="0" y="500" width="1600" height="400" fill="url(#water)"/>

  <!-- Sun reflection on water -->
  <g fill="#ffefb0" opacity=".5">
    <ellipse cx="1250" cy="520" rx="120" ry="6"/>
    <ellipse cx="1250" cy="540" rx="100" ry="4"/>
    <ellipse cx="1250" cy="560" rx="140" ry="6"/>
    <ellipse cx="1250" cy="580" rx="110" ry="4"/>
    <ellipse cx="1250" cy="610" rx="160" ry="6"/>
    <ellipse cx="1250" cy="640" rx="130" ry="5"/>
    <ellipse cx="1250" cy="680" rx="170" ry="6"/>
    <ellipse cx="1250" cy="720" rx="140" ry="4"/>
  </g>

  <!-- Water ripples -->
  <g stroke="#ffffff" stroke-width="1.5" opacity=".18">
    <line x1="0" y1="540" x2="1100" y2="540"/>
    <line x1="100" y1="580" x2="1400" y2="580"/>
    <line x1="0" y1="630" x2="1600" y2="630"/>
    <line x1="200" y1="680" x2="1400" y2="680"/>
    <line x1="0" y1="740" x2="1600" y2="740"/>
    <line x1="100" y1="800" x2="1500" y2="800"/>
    <line x1="0" y1="850" x2="1600" y2="850"/>
  </g>

  <!-- ===== Cannery buildings (mid-distance, background-right) ===== -->
  <g transform="translate(180, 280)">
    <!-- Main cannery silhouette: long building with peaked roof -->
    <rect x="0" y="100" width="540" height="180" fill="#2a1d10"/>
    <polygon points="0,100 60,40 480,40 540,100" fill="#1a1006"/>
    <polygon points="60,40 80,30 460,30 480,40" fill="#0f1a1f"/>
    <!-- Smokestack -->
    <rect x="380" y="-20" width="40" height="60" fill="#2a1d10"/>
    <rect x="375" y="-26" width="50" height="10" fill="#1a1006"/>
    <!-- Windows -->
    <g fill="#f4cd9a" opacity=".7">
      <rect x="60" y="120" width="24" height="40"/>
      <rect x="110" y="120" width="24" height="40"/>
      <rect x="160" y="120" width="24" height="40"/>
      <rect x="210" y="120" width="24" height="40"/>
      <rect x="260" y="120" width="24" height="40"/>
      <rect x="310" y="120" width="24" height="40"/>
      <rect x="360" y="120" width="24" height="40"/>
      <rect x="410" y="120" width="24" height="40"/>
      <rect x="460" y="120" width="24" height="40"/>
    </g>
    <!-- Sign -->
    <rect x="160" y="180" width="220" height="36" fill="#fafaf7" opacity=".55"/>
    <text x="270" y="204" text-anchor="middle" fill="#2a1d10" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing=".2em">STEVESTON · EST.</text>
  </g>

  <!-- Second smaller cannery building (right) -->
  <g transform="translate(820, 320)">
    <rect x="0" y="80" width="280" height="120" fill="#3a2818"/>
    <polygon points="0,80 40,40 240,40 280,80" fill="#2a1d10"/>
    <g fill="#f4cd9a" opacity=".6">
      <rect x="30" y="100" width="20" height="30"/>
      <rect x="70" y="100" width="20" height="30"/>
      <rect x="110" y="100" width="20" height="30"/>
      <rect x="150" y="100" width="20" height="30"/>
      <rect x="190" y="100" width="20" height="30"/>
      <rect x="230" y="100" width="20" height="30"/>
    </g>
  </g>

  <!-- Pilings / piers extending into water -->
  <g fill="#1a1006">
    <rect x="160" y="500" width="14" height="60"/>
    <rect x="200" y="500" width="14" height="64"/>
    <rect x="240" y="500" width="14" height="60"/>
    <rect x="280" y="500" width="14" height="66"/>
    <rect x="320" y="500" width="14" height="60"/>
    <rect x="360" y="500" width="14" height="66"/>
    <rect x="400" y="500" width="14" height="60"/>
    <rect x="440" y="500" width="14" height="68"/>
    <rect x="480" y="500" width="14" height="60"/>
    <rect x="520" y="500" width="14" height="64"/>
    <rect x="560" y="500" width="14" height="60"/>
    <rect x="600" y="500" width="14" height="66"/>
    <rect x="640" y="500" width="14" height="60"/>
    <rect x="680" y="500" width="14" height="64"/>
    <rect x="720" y="500" width="14" height="60"/>
    <rect x="760" y="500" width="14" height="66"/>
    <rect x="800" y="500" width="14" height="60"/>
    <rect x="840" y="500" width="14" height="64"/>
    <rect x="880" y="500" width="14" height="60"/>
    <rect x="920" y="500" width="14" height="66"/>
    <rect x="960" y="500" width="14" height="60"/>
    <rect x="1000" y="500" width="14" height="64"/>
  </g>

  <!-- Wooden dock (foreground) -->
  <g>
    <!-- Dock surface -->
    <rect x="0" y="640" width="1600" height="80" fill="#5a4830"/>
    <!-- Plank seams -->
    <g stroke="#3a2818" stroke-width="2">
      <line x1="0" y1="660" x2="1600" y2="660"/>
      <line x1="0" y1="680" x2="1600" y2="680"/>
      <line x1="0" y1="700" x2="1600" y2="700"/>
    </g>
    <g stroke="#3a2818" stroke-width="1">
      <line x1="120" y1="640" x2="120" y2="720"/>
      <line x1="280" y1="640" x2="280" y2="720"/>
      <line x1="440" y1="640" x2="440" y2="720"/>
      <line x1="600" y1="640" x2="600" y2="720"/>
      <line x1="760" y1="640" x2="760" y2="720"/>
      <line x1="920" y1="640" x2="920" y2="720"/>
      <line x1="1080" y1="640" x2="1080" y2="720"/>
      <line x1="1240" y1="640" x2="1240" y2="720"/>
      <line x1="1400" y1="640" x2="1400" y2="720"/>
    </g>
    <!-- Dock edge highlight -->
    <rect x="0" y="640" width="1600" height="4" fill="#7a6248"/>

    <!-- Foreground railing / posts -->
    <g fill="#2a1d10">
      <rect x="100" y="540" width="14" height="100"/>
      <rect x="380" y="540" width="14" height="100"/>
      <rect x="780" y="540" width="14" height="100"/>
      <rect x="1180" y="540" width="14" height="100"/>
      <rect x="1500" y="540" width="14" height="100"/>
    </g>
    <!-- Top rail -->
    <rect x="80" y="538" width="1450" height="8" fill="#3a2818"/>
  </g>

  <!-- Solo gull silhouette far -->
  <g transform="translate(540, 200)" fill="#1a1006">
    <path d="M 0 0 Q 8 -8 16 0 Q 24 -8 32 0"/>
  </g>
  <g transform="translate(720, 240) scale(0.6)" fill="#1a1006">
    <path d="M 0 0 Q 8 -8 16 0 Q 24 -8 32 0"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="80" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing=".25em" opacity=".7">LULU ISLAND · GOLDEN HOUR</text>

  <!-- Bottom caption -->
  <text x="800" y="830" text-anchor="middle" fill="#fafaf7" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing=".05em" opacity=".85">The houses change. The salt doesn't.</text>
</svg>
