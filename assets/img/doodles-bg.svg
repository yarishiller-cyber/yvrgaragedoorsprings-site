<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Tileable garage-door-themed doodle pattern. Each motif drawn at a different
       rotation and scale so the tile doesn't visibly repeat. Drawn in one
       muted ink colour; transparency lives in the consuming CSS so the page
       background colour can vary. -->
  <defs>
    <style>
      .d { fill: none; stroke: #0f1a1f; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .d-fill { fill: #0f1a1f; }
    </style>
  </defs>

  <g opacity="0.045">
    <!-- =================== TORSION SPRING (long horizontal coil) =================== -->
    <g transform="translate(40, 80) rotate(-8)">
      <line x1="-10" y1="0" x2="180" y2="0" class="d"/>
      <path class="d" d="M 0 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 24 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 48 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 72 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 96 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 120 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 144 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0"/>
      <circle cx="-10" cy="0" r="3" class="d-fill"/>
      <circle cx="172" cy="0" r="3" class="d-fill"/>
    </g>

    <!-- =================== ROLLER (wheel with stem) =================== -->
    <g transform="translate(380, 110)">
      <circle cx="0" cy="0" r="14" class="d"/>
      <circle cx="0" cy="0" r="5" class="d"/>
      <line x1="14" y1="0" x2="32" y2="0" class="d"/>
      <circle cx="32" cy="0" r="2" class="d-fill"/>
      <line x1="-14" y1="0" x2="-22" y2="0" class="d"/>
    </g>

    <!-- =================== HINGE PLATE =================== -->
    <g transform="translate(120, 240) rotate(12)">
      <rect x="0" y="0" width="42" height="22" rx="2" class="d"/>
      <line x1="14" y1="0" x2="14" y2="22" class="d"/>
      <line x1="28" y1="0" x2="28" y2="22" class="d"/>
      <circle cx="6" cy="6" r="1.4" class="d-fill"/>
      <circle cx="6" cy="16" r="1.4" class="d-fill"/>
      <circle cx="36" cy="6" r="1.4" class="d-fill"/>
      <circle cx="36" cy="16" r="1.4" class="d-fill"/>
      <circle cx="21" cy="11" r="3.5" class="d"/>
    </g>

    <!-- =================== WINDING BAR =================== -->
    <g transform="translate(330, 260) rotate(35)">
      <rect x="0" y="-2" width="70" height="4" rx="1" class="d-fill"/>
      <circle cx="-2" cy="0" r="3" class="d"/>
    </g>

    <!-- =================== GARAGE DOOR PANEL (small) =================== -->
    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="88" height="44" rx="2" class="d"/>
      <line x1="0" y1="11" x2="88" y2="11" class="d"/>
      <line x1="0" y1="22" x2="88" y2="22" class="d"/>
      <line x1="0" y1="33" x2="88" y2="33" class="d"/>
      <circle cx="6" cy="5.5" r="1" class="d-fill"/>
      <circle cx="82" cy="5.5" r="1" class="d-fill"/>
    </g>

    <!-- =================== CABLE (frayed end) =================== -->
    <g transform="translate(250, 380) rotate(-18)">
      <path class="d" d="M 0 0 Q 20 4 40 0 Q 60 -4 80 0 L 90 -6 M 90 0 L 100 4 M 90 6 L 102 8"/>
    </g>

    <!-- =================== TORSION SPRING (smaller) =================== -->
    <g transform="translate(380, 380) rotate(20)">
      <line x1="-6" y1="0" x2="110" y2="0" class="d"/>
      <path class="d" d="M 0 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 16 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 32 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 48 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 64 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 80 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0
                       M 96 0 m 0 -7 q 4 -7 8 0 q -4 7 -8 0"/>
    </g>

    <!-- =================== WRENCH =================== -->
    <g transform="translate(120, 500) rotate(-30)">
      <path class="d" d="M -6 -6 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0 z M 6 -6 L 12 -12 M 6 6 L 12 12 M 0 6 L 0 32 a 4 4 0 0 0 8 0 L 8 6 z"/>
    </g>

    <!-- =================== OPENER UNIT (small box w/ pull cord) =================== -->
    <g transform="translate(290, 510)">
      <rect x="0" y="0" width="34" height="14" rx="1" class="d"/>
      <line x1="6" y1="4" x2="28" y2="4" class="d"/>
      <line x1="6" y1="8" x2="28" y2="8" class="d"/>
      <line x1="17" y1="14" x2="17" y2="34" class="d" stroke="#d94a2b" stroke-width="1.4"/>
      <ellipse cx="17" cy="36" rx="3" ry="2" fill="#d94a2b" stroke="#0f1a1f" stroke-width="0.8"/>
    </g>

    <!-- =================== HEX BOLT =================== -->
    <g transform="translate(440, 520)">
      <polygon points="0,-9 8,-5 8,5 0,9 -8,5 -8,-5" class="d"/>
      <circle cx="0" cy="0" r="2.5" class="d-fill"/>
    </g>

    <!-- =================== SCREW =================== -->
    <g transform="translate(540, 240) rotate(45)">
      <rect x="-4" y="-9" width="8" height="4" rx="0.5" class="d"/>
      <line x1="-3" y1="-7" x2="3" y2="-7" class="d"/>
      <path class="d" d="M -4 -5 L 0 22 L 4 -5"/>
      <line x1="-2" y1="0" x2="2" y2="0" class="d"/>
      <line x1="-2" y1="6" x2="2" y2="6" class="d"/>
      <line x1="-1.5" y1="12" x2="1.5" y2="12" class="d"/>
    </g>

    <!-- ========== HORIZONTAL HALF-TILE OVERLAP for seamless tiling ========== -->
    <!-- These motifs sit on the seam so when the SVG tiles repeat, the pattern continues smoothly. -->
    <g transform="translate(560, 80) rotate(-8)">
      <line x1="-10" y1="0" x2="80" y2="0" class="d"/>
      <path class="d" d="M 0 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 24 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0
                       M 48 0 m 0 -10 q 6 -10 12 0 q -6 10 -12 0"/>
    </g>
  </g>
</svg>
