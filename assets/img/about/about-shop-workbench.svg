<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Trade-shop interior workbench with torsion spring inventory racked behind</title>
  <desc id="desc">Editorial illustration of a small shop interior. Workbench in foreground with tools, wall behind shows torsion spring inventory on racks. Morning light from a high window.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dccf"/>
      <stop offset="1" stop-color="#c8bfa9"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d674a"/>
      <stop offset="1" stop-color="#5a4830"/>
    </linearGradient>
    <radialGradient id="window-light" cx="0.78" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#fffce8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fffce8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#window-light)"/>

  <!-- High window -->
  <g transform="translate(1080, 40)">
    <rect width="360" height="180" fill="#cfdde5" stroke="#0f1a1f" stroke-width="4"/>
    <line x1="180" y1="0" x2="180" y2="180" stroke="#0f1a1f" stroke-width="4"/>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#0f1a1f" stroke-width="4"/>
    <rect width="360" height="180" fill="#fffce8" opacity=".4"/>
  </g>

  <!-- Light beam from window -->
  <polygon points="1260,220 1440,220 1600,660 1300,720" fill="#fffce8" opacity=".18"/>

  <!-- Spring inventory rack on wall -->
  <g transform="translate(120, 140)">
    <!-- Rack frame -->
    <rect x="0" y="0" width="900" height="380" fill="none" stroke="#0f1a1f" stroke-width="4"/>
    <line x1="0" y1="95" x2="900" y2="95" stroke="#0f1a1f" stroke-width="3"/>
    <line x1="0" y1="190" x2="900" y2="190" stroke="#0f1a1f" stroke-width="3"/>
    <line x1="0" y1="285" x2="900" y2="285" stroke="#0f1a1f" stroke-width="3"/>

    <!-- Springs row 1: small -->
    <g>
      <rect x="40" y="20" width="220" height="60" fill="#0f1a1f"/>
      <g stroke="#7a8489" stroke-width="2" opacity=".6">
        <line x1="48" y1="20" x2="48" y2="80"/><line x1="60" y1="20" x2="60" y2="80"/><line x1="72" y1="20" x2="72" y2="80"/><line x1="84" y1="20" x2="84" y2="80"/><line x1="96" y1="20" x2="96" y2="80"/><line x1="108" y1="20" x2="108" y2="80"/><line x1="120" y1="20" x2="120" y2="80"/><line x1="132" y1="20" x2="132" y2="80"/><line x1="144" y1="20" x2="144" y2="80"/><line x1="156" y1="20" x2="156" y2="80"/><line x1="168" y1="20" x2="168" y2="80"/><line x1="180" y1="20" x2="180" y2="80"/><line x1="192" y1="20" x2="192" y2="80"/><line x1="204" y1="20" x2="204" y2="80"/><line x1="216" y1="20" x2="216" y2="80"/><line x1="228" y1="20" x2="228" y2="80"/><line x1="240" y1="20" x2="240" y2="80"/><line x1="252" y1="20" x2="252" y2="80"/>
      </g>
      <text x="290" y="56" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.207 × 2" × 24"</text>
      <rect x="320" y="20" width="220" height="60" fill="#0f1a1f"/>
      <text x="570" y="56" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.225 × 2" × 26"</text>
      <rect x="600" y="20" width="240" height="60" fill="#0f1a1f"/>
      <text x="850" y="56" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.243 × 2" × 28"</text>
    </g>

    <!-- Springs row 2: medium -->
    <g>
      <rect x="40" y="115" width="260" height="60" fill="#0f1a1f"/>
      <text x="330" y="151" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.250 × 2" × 30"</text>
      <rect x="360" y="115" width="260" height="60" fill="#0f1a1f"/>
      <text x="650" y="151" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.262 × 2" × 32"</text>
      <rect x="680" y="115" width="160" height="60" fill="#0f1a1f"/>
      <text x="850" y="151" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">.275</text>
    </g>

    <!-- Springs row 3: high-cycle (thicker) -->
    <g>
      <rect x="40" y="210" width="300" height="60" fill="#1f3a44"/>
      <text x="370" y="246" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">25K-cycle pair · 2 1/4"</text>
      <rect x="400" y="210" width="300" height="60" fill="#1f3a44"/>
      <text x="710" y="246" fill="#1f3a44" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">25K · stainless</text>
    </g>

    <!-- Springs row 4: cables -->
    <g>
      <g stroke="#cfd6da" stroke-width="3" fill="none">
        <path d="M40,330 Q140,300 240,340"/>
        <path d="M260,335 Q360,305 460,345"/>
        <path d="M480,335 Q580,310 680,340"/>
      </g>
      <text x="40" y="362" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">CABLES · stainless · coastal-spec</text>
    </g>
  </g>

  <!-- Workbench surface -->
  <rect x="0" y="640" width="1600" height="40" fill="url(#bench)"/>
  <rect x="0" y="680" width="1600" height="320" fill="#4a3826"/>
  <!-- Bench legs -->
  <rect x="100" y="680" width="40" height="320" fill="#2a1d10"/>
  <rect x="1460" y="680" width="40" height="320" fill="#2a1d10"/>
  <!-- Bench grain -->
  <g stroke="#3a2a18" stroke-width="2" opacity=".5">
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="670" x2="1600" y2="670"/>
  </g>

  <!-- Tools on bench -->
  <!-- Winding bars (pair) -->
  <g transform="translate(140, 600)">
    <rect width="320" height="14" rx="3" fill="#0f1a1f"/>
    <circle cx="0" cy="7" r="10" fill="#1f3a44"/>
    <rect y="40" width="320" height="14" rx="3" fill="#0f1a1f"/>
    <circle cx="0" cy="47" r="10" fill="#1f3a44"/>
  </g>
  <!-- Vise grips -->
  <g transform="translate(560, 605)">
    <rect width="120" height="18" rx="3" fill="#c8932a"/>
    <rect x="120" y="-6" width="80" height="30" rx="4" fill="#0f1a1f"/>
    <rect x="20" y="-10" width="40" height="14" rx="2" fill="#c8932a"/>
  </g>
  <!-- Drum wrench / socket -->
  <g transform="translate(820, 600)">
    <rect width="160" height="14" rx="2" fill="#1f3a44"/>
    <rect width="40" height="34" y="-10" rx="4" fill="#1f3a44"/>
    <circle cx="20" cy="7" r="14" fill="#3a525c"/>
  </g>
  <!-- Cordless drill -->
  <g transform="translate(1040, 580)">
    <rect x="0" y="0" width="120" height="50" rx="10" fill="#d94a2b"/>
    <rect x="40" y="50" width="40" height="60" rx="6" fill="#d94a2b"/>
    <rect x="40" y="110" width="50" height="14" rx="3" fill="#0f1a1f"/>
    <circle cx="120" cy="25" r="14" fill="#0f1a1f"/>
    <circle cx="125" cy="25" r="6" fill="#cfd6da"/>
  </g>
  <!-- Gloves -->
  <g transform="translate(1220, 612) rotate(-8)">
    <rect width="120" height="60" rx="14" fill="#3a2a18"/>
    <rect x="100" y="6" width="30" height="14" rx="6" fill="#3a2a18"/>
    <rect x="100" y="22" width="30" height="14" rx="6" fill="#3a2a18"/>
    <rect x="100" y="38" width="26" height="14" rx="6" fill="#3a2a18"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="940" width="1600" height="60" fill="#3a2a18"/>

  <!-- Brand on rack header -->
  <text x="1280" y="280" text-anchor="middle" fill="#0f1a1f" opacity=".4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing=".15em">STILL CREEK SHOP</text>
</svg>
