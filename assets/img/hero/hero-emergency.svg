<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Broken garage door torsion spring with visible coil gap</title>
  <desc id="desc">Editorial illustration of a horizontal torsion spring on its shaft with a clear gap in the middle coils, a red arrow pointing to the failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e8e1d2"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a44"/>
      <stop offset=".5" stop-color="#0f1a1f"/>
      <stop offset="1" stop-color="#1f3a44"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d9aa1"/>
      <stop offset=".5" stop-color="#cfd6da"/>
      <stop offset="1" stop-color="#6a7a82"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bg)"/>

  <!-- Soft horizontal light band suggesting window light -->
  <rect x="0" y="180" width="1600" height="260" fill="#ffffff" opacity=".35"/>

  <!-- Wall texture: faint vertical stripes (subtle siding) -->
  <g opacity=".06" stroke="#0f1a1f" stroke-width="1">
    <line x1="0" y1="60" x2="1600" y2="60"/>
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="900" x2="1600" y2="900"/>
    <line x1="0" y1="960" x2="1600" y2="960"/>
    <line x1="0" y1="1020" x2="1600" y2="1020"/>
    <line x1="0" y1="1080" x2="1600" y2="1080"/>
    <line x1="0" y1="1140" x2="1600" y2="1140"/>
  </g>

  <!-- Mounting bracket left -->
  <g>
    <rect x="80" y="520" width="80" height="220" fill="#0f1a1f"/>
    <rect x="60" y="700" width="120" height="32" fill="#0f1a1f"/>
    <circle cx="100" cy="560" r="6" fill="#cfd6da"/>
    <circle cx="140" cy="560" r="6" fill="#cfd6da"/>
    <circle cx="100" cy="660" r="6" fill="#cfd6da"/>
    <circle cx="140" cy="660" r="6" fill="#cfd6da"/>
  </g>

  <!-- Mounting bracket right -->
  <g>
    <rect x="1440" y="520" width="80" height="220" fill="#0f1a1f"/>
    <rect x="1420" y="700" width="120" height="32" fill="#0f1a1f"/>
    <circle cx="1460" cy="560" r="6" fill="#cfd6da"/>
    <circle cx="1500" cy="560" r="6" fill="#cfd6da"/>
    <circle cx="1460" cy="660" r="6" fill="#cfd6da"/>
    <circle cx="1500" cy="660" r="6" fill="#cfd6da"/>
  </g>

  <!-- Center bracket (where shaft passes through) -->
  <g>
    <rect x="780" y="540" width="40" height="200" fill="#0f1a1f" opacity=".9"/>
  </g>

  <!-- Shaft running across -->
  <rect x="60" y="616" width="1480" height="36" fill="url(#shaft)"/>
  <rect x="60" y="616" width="1480" height="6" fill="#ffffff" opacity=".25"/>

  <!-- LEFT coil section (compressed, intact) -->
  <g transform="translate(180, 528)">
    <rect x="0" y="0" width="540" height="212" rx="6" fill="url(#spring)"/>
    <!-- Coil winding lines -->
    <g stroke="#cfd6da" stroke-width="2" opacity=".55" fill="none">
      <line x1="14" y1="0" x2="14" y2="212"/>
      <line x1="34" y1="0" x2="34" y2="212"/>
      <line x1="54" y1="0" x2="54" y2="212"/>
      <line x1="74" y1="0" x2="74" y2="212"/>
      <line x1="94" y1="0" x2="94" y2="212"/>
      <line x1="114" y1="0" x2="114" y2="212"/>
      <line x1="134" y1="0" x2="134" y2="212"/>
      <line x1="154" y1="0" x2="154" y2="212"/>
      <line x1="174" y1="0" x2="174" y2="212"/>
      <line x1="194" y1="0" x2="194" y2="212"/>
      <line x1="214" y1="0" x2="214" y2="212"/>
      <line x1="234" y1="0" x2="234" y2="212"/>
      <line x1="254" y1="0" x2="254" y2="212"/>
      <line x1="274" y1="0" x2="274" y2="212"/>
      <line x1="294" y1="0" x2="294" y2="212"/>
      <line x1="314" y1="0" x2="314" y2="212"/>
      <line x1="334" y1="0" x2="334" y2="212"/>
      <line x1="354" y1="0" x2="354" y2="212"/>
      <line x1="374" y1="0" x2="374" y2="212"/>
      <line x1="394" y1="0" x2="394" y2="212"/>
      <line x1="414" y1="0" x2="414" y2="212"/>
      <line x1="434" y1="0" x2="434" y2="212"/>
      <line x1="454" y1="0" x2="454" y2="212"/>
      <line x1="474" y1="0" x2="474" y2="212"/>
      <line x1="494" y1="0" x2="494" y2="212"/>
      <line x1="514" y1="0" x2="514" y2="212"/>
      <line x1="528" y1="0" x2="528" y2="212"/>
    </g>
    <!-- Highlight along top -->
    <rect x="0" y="2" width="540" height="20" fill="#ffffff" opacity=".18"/>
    <!-- Shadow along bottom -->
    <rect x="0" y="190" width="540" height="22" fill="#000000" opacity=".25"/>
  </g>

  <!-- THE GAP: a clear ~100-unit gap, slightly off-center -->
  <!-- Shaft shows through here, bare metal -->

  <!-- RIGHT coil section (recoiled away from center, shorter — released tension) -->
  <g transform="translate(880, 528)">
    <rect x="0" y="0" width="540" height="212" rx="6" fill="url(#spring)"/>
    <g stroke="#cfd6da" stroke-width="2" opacity=".55" fill="none">
      <line x1="12" y1="0" x2="12" y2="212"/>
      <line x1="32" y1="0" x2="32" y2="212"/>
      <line x1="52" y1="0" x2="52" y2="212"/>
      <line x1="72" y1="0" x2="72" y2="212"/>
      <line x1="92" y1="0" x2="92" y2="212"/>
      <line x1="112" y1="0" x2="112" y2="212"/>
      <line x1="132" y1="0" x2="132" y2="212"/>
      <line x1="152" y1="0" x2="152" y2="212"/>
      <line x1="172" y1="0" x2="172" y2="212"/>
      <line x1="192" y1="0" x2="192" y2="212"/>
      <line x1="212" y1="0" x2="212" y2="212"/>
      <line x1="232" y1="0" x2="232" y2="212"/>
      <line x1="252" y1="0" x2="252" y2="212"/>
      <line x1="272" y1="0" x2="272" y2="212"/>
      <line x1="292" y1="0" x2="292" y2="212"/>
      <line x1="312" y1="0" x2="312" y2="212"/>
      <line x1="332" y1="0" x2="332" y2="212"/>
      <line x1="352" y1="0" x2="352" y2="212"/>
      <line x1="372" y1="0" x2="372" y2="212"/>
      <line x1="392" y1="0" x2="392" y2="212"/>
      <line x1="412" y1="0" x2="412" y2="212"/>
      <line x1="432" y1="0" x2="432" y2="212"/>
      <line x1="452" y1="0" x2="452" y2="212"/>
      <line x1="472" y1="0" x2="472" y2="212"/>
      <line x1="492" y1="0" x2="492" y2="212"/>
      <line x1="512" y1="0" x2="512" y2="212"/>
      <line x1="528" y1="0" x2="528" y2="212"/>
    </g>
    <rect x="0" y="2" width="540" height="20" fill="#ffffff" opacity=".18"/>
    <rect x="0" y="190" width="540" height="22" fill="#000000" opacity=".25"/>
  </g>

  <!-- End cones (cone fittings at the broken ends) -->
  <polygon points="720,528 720,740 740,634" fill="#0f1a1f"/>
  <polygon points="880,528 880,740 860,634" fill="#0f1a1f"/>

  <!-- Twisted broken coil ends -->
  <path d="M 720 612 Q 740 620 760 614 Q 780 608 790 622" stroke="#0f1a1f" stroke-width="6" fill="none"/>
  <path d="M 720 656 Q 740 664 760 658 Q 780 652 790 666" stroke="#0f1a1f" stroke-width="6" fill="none"/>
  <path d="M 880 612 Q 860 620 840 614 Q 820 608 810 622" stroke="#0f1a1f" stroke-width="6" fill="none"/>
  <path d="M 880 656 Q 860 664 840 658 Q 820 652 810 666" stroke="#0f1a1f" stroke-width="6" fill="none"/>

  <!-- Shadow under spring -->
  <ellipse cx="800" cy="780" rx="700" ry="20" fill="#0f1a1f" opacity=".15"/>

  <!-- RED ARROW pointing to the gap -->
  <g>
    <!-- Arrow shaft -->
    <path d="M 800 280 L 800 480" stroke="#d94a2b" stroke-width="14" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="800,520 770,470 830,470" fill="#d94a2b"/>
    <!-- Label callout -->
    <g transform="translate(620, 200)">
      <rect width="360" height="64" rx="32" fill="#d94a2b"/>
      <text x="180" y="42" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing=".02em">BROKEN HERE</text>
    </g>
  </g>

  <!-- Subtle "garage door" implied below -->
  <g opacity=".15">
    <rect x="0" y="820" width="1600" height="380" fill="#0f1a1f"/>
    <line x1="0" y1="890" x2="1600" y2="890" stroke="#fafaf7" stroke-width="2"/>
    <line x1="0" y1="970" x2="1600" y2="970" stroke="#fafaf7" stroke-width="2"/>
    <line x1="0" y1="1050" x2="1600" y2="1050" stroke="#fafaf7" stroke-width="2"/>
    <line x1="0" y1="1130" x2="1600" y2="1130" stroke="#fafaf7" stroke-width="2"/>
  </g>
</svg>
