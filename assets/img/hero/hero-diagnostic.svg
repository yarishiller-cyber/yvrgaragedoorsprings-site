<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">A garage door spring diagnostic checklist on a clipboard</title>
  <desc id="desc">Top-down shot of a clipboard with a three-item diagnostic checklist.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d4c8"/>
      <stop offset="1" stop-color="#bcb39d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#bench)"/>

  <!-- Bench planks -->
  <g stroke="#9b8d72" stroke-width="2" opacity=".5">
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <line x1="0" y1="960" x2="1600" y2="960"/>
  </g>

  <!-- Van keys (top right) -->
  <g transform="translate(1180, 200) rotate(20)">
    <rect x="0" y="0" width="160" height="50" rx="10" fill="#0f1a1f"/>
    <circle cx="20" cy="25" r="14" fill="#fafaf7"/>
    <text x="20" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f1a1f">Y</text>
    <rect x="160" y="20" width="60" height="10" fill="#cfd6da"/>
    <rect x="220" y="14" width="14" height="22" fill="#cfd6da"/>
    <rect x="220" y="14" width="6" height="6" fill="#cfd6da"/>
    <rect x="228" y="14" width="6" height="6" fill="#cfd6da"/>
  </g>

  <!-- Clipboard -->
  <g transform="translate(280, 140)">
    <!-- Board -->
    <rect x="0" y="0" width="1040" height="900" rx="14" fill="#3a2a18" stroke="#2a1d10" stroke-width="6"/>
    <!-- Clip -->
    <rect x="420" y="-30" width="200" height="80" rx="14" fill="#8d9aa1"/>
    <rect x="450" y="-10" width="140" height="40" rx="6" fill="#cfd6da"/>
    <!-- Paper -->
    <rect x="40" y="60" width="960" height="800" fill="#fafaf7"/>
    <!-- Paper shadow -->
    <rect x="40" y="60" width="960" height="800" fill="none" stroke="#0f1a1f" stroke-width="2" opacity=".15"/>
    <!-- Paper holes -->
    <circle cx="80" cy="100" r="8" fill="#3a2a18"/>
    <circle cx="80" cy="180" r="8" fill="#3a2a18"/>
    <circle cx="80" cy="260" r="8" fill="#3a2a18"/>

    <!-- Title -->
    <text x="520" y="160" text-anchor="middle" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing=".01em">30-second diagnosis</text>
    <line x1="160" y1="200" x2="880" y2="200" stroke="#d9d4c8" stroke-width="2"/>

    <!-- Item 1 -->
    <g transform="translate(160, 280)">
      <rect x="0" y="0" width="48" height="48" fill="none" stroke="#0f1a1f" stroke-width="4"/>
      <text x="76" y="36" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Loud bang?</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(160, 400)">
      <rect x="0" y="0" width="48" height="48" fill="none" stroke="#0f1a1f" stroke-width="4"/>
      <text x="76" y="36" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Gap in the coil?</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(160, 520)">
      <rect x="0" y="0" width="48" height="48" fill="none" stroke="#0f1a1f" stroke-width="4"/>
      <text x="76" y="36" fill="#0f1a1f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Opener strains?</text>
    </g>

    <!-- Footnote -->
    <line x1="160" y1="660" x2="880" y2="660" stroke="#d9d4c8" stroke-width="2"/>
    <text x="160" y="720" fill="#3a4a52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">If any answer is yes, call.</text>
    <text x="160" y="760" fill="#d94a2b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">The door doesn't lie.</text>
  </g>

  <!-- Pencil -->
  <g transform="translate(1340, 800) rotate(-30)">
    <rect x="0" y="0" width="220" height="22" fill="#c8932a"/>
    <polygon points="220,0 260,11 220,22" fill="#fafaf7"/>
    <polygon points="260,11 254,11 254,11" fill="#0f1a1f"/>
    <polygon points="248,8 260,11 248,14" fill="#0f1a1f"/>
    <rect x="-20" y="-2" width="20" height="26" fill="#d94a2b"/>
    <rect x="-30" y="-2" width="10" height="26" fill="#cfd6da"/>
  </g>
</svg>
